name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The **Test ebusd and search the devices** button of the configuration often tells where it stops: paste its message below.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.3.0'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → ebusd, Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Heating and ebusd
      description: The brand and model of the boiler or heat pump and of the controller, the ebusd version and the adapter.
      placeholder: 'Vaillant ecoTEC plus + VRC 700, ebusd 26.1, eBUS Adapter Shield v5'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: What does `ebusctl info` say (signal, devices, configuration loaded)? Does `ebusctl read` work for the same message? Are changes allowed in the settings?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Logs tab of the integration page), ideally with the SDK debug logs: add the environment variable `DEBUG=gladys-integration-sdk` to the container, reproduce, then copy the lines.
      render: text
